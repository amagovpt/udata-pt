name: Tests

on:
  push:
    # Environment branches only. Feature branches are covered by the
    # pull_request trigger, so this avoids running the suite twice per PR.
    branches: [develop, tst, ppr, main]
  pull_request:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint and test suite
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      mongo:
        image: mongo:7.0.28
        ports:
          # 27019 on the runner, because that is where the suite looks by
          # default (udata/tests/plugin.py). The container still listens on
          # 27017 -- only the published port moves. Service containers are
          # isolated per job on an ephemeral runner, so nothing collides.
          - 27019:27017
        # Pinned, not inherited -- and pinned even though the runner's default
        # may already be adequate. Trusting an inherited value is precisely the
        # defect LEDG-2489 fixed locally: Docker's 1024 was never chosen by
        # anyone, it was just what nobody overrode. 64000 is the minimum mongod
        # names in its own startup warning. The step above reports what is
        # actually in force, so this can be checked rather than believed.
        options: >-
          --ulimit nofile=64000:64000
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      # Run against settings.Defaults + settings.Testing only. udata.cfg is tracked in
      # this repo and create_app loads it over the defaults, so leaving it in place would
      # make the suite depend on a deployment config file (and on whichever .env keys the
      # runner happens to have -- with no .env its unconditional _env_int/_env_bool calls
      # resolve the password policy to zero length and no requirements). Pointing
      # UDATA_SETTINGS at a path that does not exist skips that load entirely, which is
      # what udata/tests/__init__.py asks for. The deployment config is checked on its
      # own, in the step at the end of this job.
      UDATA_SETTINGS: /nonexistent/udata.cfg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock

      # Plain `uv sync` installs the default dependency-group. This project has no
      # [project.optional-dependencies] table, so `--extra dev` / `--extra test` are not
      # valid here and abort the install.
      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check --extend-select I .

      - name: Format
        run: uv run ruff format --check .

      # Prints, never fails. LEDG-2489: the test MongoDB died mid-run of file
      # descriptor exhaustion against Docker's default ceiling of 1024, and the
      # only reason anyone found out was reading the server's own startup
      # warning. This runner inherits whatever limit the runtime gives, so the
      # value is recorded on every run rather than assumed. The startup warning
      # is the authority: mongod emits it whenever the soft limit is under its
      # recommended minimum, and its absence is itself the answer.
      - name: Mongo file descriptor limits
        run: |
          docker exec "$(docker ps -qf ancestor=mongo:7.0.28)" \
            sh -c 'cat /proc/1/limits | grep -i "open files"' || true
          uv run python - <<'PY' || true
          import pymongo
          warnings = pymongo.MongoClient("localhost", 27019).admin.command(
              {"getLog": "startupWarnings"}
          )["log"]
          hits = [line for line in warnings if "rlimit" in line.lower()]
          print("\n".join(hits) if hits else "no rlimit startup warning (soft limit is adequate)")
          PY

      - name: Test suite
        run: uv run inv test --ci

      # The suite above deliberately ignores udata.cfg, which would otherwise hide drift
      # in the file itself. Run the download-proxy config assertions once more with the
      # tracked config loaded, so lowering a timeout there fails here instead of
      # surfacing as a 502 in production.
      - name: Deployment config assertions
        env:
          UDATA_SETTINGS: ${{ github.workspace }}/udata.cfg
          # udata.cfg builds MONGODB_HOST and the Redis URLs from these, and neither has a
          # default - without them the host is literally "None" and the step cannot connect.
          SERVER_MONGO: localhost
          SERVER_REDIS: localhost
        run: uv run pytest udata/tests/dataset/test_proxy_download.py -k ProxyDownloadTimeoutConfigTest
